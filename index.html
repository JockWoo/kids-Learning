<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🧮 小小數學家 — 幼兒互動數學啟蒙遊戲</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2228%22 fill=%22%234A90E2%22/><text y=%2275%22 x=%2218%22 font-size=%2270%22 font-weight=%22bold%22 fill=%22white%22 font-family=%22sans-serif, system-ui%22>123</text></svg>">

    <!-- SEO Meta Tags -->
    <meta name="description" content="專為5歲幼兒設計的互動數學啟蒙遊戲（數數、加法、減法、每日挑戰），給孩子最快樂的啟蒙體驗！">
    <meta name="theme-color" content="#4A90E2">

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">

    <!-- CSS Design System -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Canvas for Confetti Animations -->
        <canvas id="confetti-canvas"></canvas>

        <!-- Header Navigation Bar -->
        <header class="app-header">
            <div class="brand-title" id="btn-brand-title">
                <span>🧮</span> 小小數學家
            </div>
            <div class="header-controls">
                <div class="star-badge-btn" title="累積獲得星星">⭐ <span id="header-total-stars">0</span> 顆</div>
                <button class="icon-btn" id="btn-sound-toggle" title="音效設定" aria-label="音效設定">🔊</button>
                <button class="icon-btn" id="btn-parent-settings" title="家長設定" aria-label="家長設定">⚙️</button>
            </div>
        </header>

        <!-- VIEW 1: HOME SCREEN -->
        <main class="screen-view active" id="view-home">
            <div class="home-hero">
                <div class="home-logo">🧮</div>
                <h1 class="home-title">今天想玩什麼？</h1>
                <p class="home-subtitle">選一個喜歡的題目開始吧！</p>
            </div>

            <div class="mode-grid">
                <div class="mode-card count" data-mode="counting">
                    <span class="mode-icon">🍎</span>
                    <div class="mode-info">
                        <div class="mode-name">數一數</div>
                        <div class="mode-desc">數數看有幾個物品</div>
                    </div>
                </div>

                <div class="mode-card add" data-mode="addition">
                    <span class="mode-icon">➕</span>
                    <div class="mode-info">
                        <div class="mode-name">加法</div>
                        <div class="mode-desc">把物品加起來</div>
                    </div>
                </div>

                <div class="mode-card sub" data-mode="subtraction">
                    <span class="mode-icon">➖</span>
                    <div class="mode-info">
                        <div class="mode-name">減法</div>
                        <div class="mode-desc">拿掉物品算剩下</div>
                    </div>
                </div>

                <div class="mode-card challenge" data-mode="challenge">
                    <span class="mode-icon">🚀</span>
                    <div class="mode-info">
                        <div class="mode-name">每日大冒險</div>
                        <div class="mode-desc">綜合混合挑戰</div>
                    </div>
                </div>

                <a href="minigame/index.html" class="mode-card minigame-link" style="text-decoration: none; border-color: #FF6B81; background: linear-gradient(180deg, #FFFFFF 0%, #FFF5F7 100%);">
                    <span class="mode-icon">🎮</span>
                    <div class="mode-info">
                        <div class="mode-name">小遊戲 (Mini Game)</div>
                        <div class="mode-desc">接水果、餵怪獸、寶箱密碼</div>
                    </div>
                </a>
            </div>
        </main>

        <!-- VIEW 2: GAME SCREEN -->
        <main class="screen-view" id="view-game">
            <div class="game-progress-bar">
                <div class="progress-text" id="progress-text">第 1 / 10 題</div>
                <div class="score-badge" id="score-stars-text">⭐ 0</div>
            </div>

            <!-- Visual Helper (Apples, Dogs, Dinosaurs) -->
            <div class="visual-container" id="visual-container">
                <!-- Dynamically Rendered Visual Items -->
            </div>

            <!-- Large Readable Equation -->
            <div class="equation-text" id="equation-text">
                3 + 4 = ?
            </div>

            <!-- 3 Touch-Friendly Answer Buttons -->
            <div class="choices-container" id="choices-container">
                <!-- Dynamically Rendered Buttons -->
            </div>

            <!-- Immediate Feedback Banner -->
            <div class="feedback-banner" id="feedback-banner">
                <span id="feedback-text">🎉 答對啦！</span>
            </div>
        </main>

        <!-- VIEW 3: RESULT SCREEN -->
        <main class="screen-view" id="view-result">
            <div class="result-card">
                <h2 class="result-title">🎉 冒險完成！</h2>
                <div class="result-stars" id="result-stars">⭐⭐⭐⭐⭐</div>
                <div class="result-score" id="result-score">答對 10 / 10 題</div>
                <div class="result-message" id="result-message">太棒了！你是數學小天才！</div>

                <p style="font-size: 1.25rem; font-weight: 800; color: #D9480F; margin: 12px 0;" id="result-total-stars-text">
                    ⭐ 總共累積：0 顆星
                </p>

                <div class="result-actions">
                    <button class="btn-primary" id="btn-replay">再玩一次</button>
                    <button class="btn-secondary" id="btn-home">回到首頁</button>
                </div>
            </div>
        </main>
    </div>

    <!-- PARENT SETTINGS MODAL -->
    <div class="modal-overlay" id="modal-parent-settings">
        <div class="modal-card">
            <div class="modal-toast" id="modal-toast">✅ 已成功儲存設定！</div>

            <div class="modal-header">
                <h3 class="modal-title">⚙️ 家長設定 (Parent Settings)</h3>
                <button class="icon-btn" id="btn-close-modal" aria-label="關閉設定">✖</button>
            </div>

            <!-- Current Settings Summary Card -->
            <div class="settings-summary-card">
                <div class="settings-summary-item">
                    🎯 範圍：<span class="settings-summary-value" id="summary-range-text">0–10</span>
                </div>
                <div class="settings-summary-item">
                    📝 題數：<span class="settings-summary-value" id="summary-length-text">10 題</span>
                </div>
            </div>

            <div class="modal-group">
                <label class="modal-label">🎯 數字範圍 (Number Range)</label>
                <div class="segmented-control" id="segment-range">
                    <button data-value="5"><span class="check-icon">✓</span> 0–5</button>
                    <button data-value="10" class="active"><span class="check-icon">✓</span> 0–10</button>
                    <button data-value="20"><span class="check-icon">✓</span> 0–20</button>
                </div>
            </div>

            <div class="modal-group">
                <label class="modal-label">📝 每局題數 (Questions per Round)</label>
                <div class="segmented-control" id="segment-length">
                    <button data-value="5"><span class="check-icon">✓</span> 5 題</button>
                    <button data-value="10" class="active"><span class="check-icon">✓</span> 10 題</button>
                    <button data-value="20"><span class="check-icon">✓</span> 20 題</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Modules -->
    <script src="js/themes.js"></script>
    <script src="js/difficulty.js"></script>
    <script src="js/question-engine.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
